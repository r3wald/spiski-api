services:
  # FrankenPHP: API, statische Dateien und Mercure-Hub (CLAUDE.md 13).
  php:
    build:
      context: .
      target: dev
    ports:
      - "${HTTP_PORT:-8081}:80"
      # Vite-Dev-Server der Admin-Oberflaeche (make admin-dev), nur bei Bedarf belegt.
      - "${ADMIN_DEV_PORT:-5173}:5173"
    volumes:
      - .:/app
      - ./docker/frankenphp/Caddyfile:/etc/frankenphp/Caddyfile:ro
      - composer_cache:/tmp/composer
      - caddy_data:/data
      - caddy_config:/config
    # APP_ENV und DATABASE_URL werden hier bewusst NICHT gesetzt. Echte
    # Umgebungsvariablen haben in Symfony Vorrang vor .env-Dateien; sie wuerden
    # .env.test aushebeln und den Testlauf auf die Entwicklungsdatenbank lenken –
    # die er zwischen den Tests per TRUNCATE leert.
    environment:
      # Der Hub liest den Schluessel aus der Umgebung, Symfony aus .env – beide
      # muessen gleich sein.
      MERCURE_JWT_SECRET: dev-only-mercure-secret-0123456789abcdef
    depends_on:
      postgres:
        condition: service_healthy
    # Ersetzt den Healthcheck des FrankenPHP-Images (Caddy-Admin auf Port 2019, hier
    # per `admin off` abgeschaltet, also immer unhealthy). Statische Datei statt
    # /v1/health: Muss auch ohne vendor/ gruen werden, sonst blockiert
    # `docker compose up --wait` (make up) ein `make install` nach frischem Clone.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1/robots.txt"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
      start_interval: 1s

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: spiski
      POSTGRES_USER: spiski
      POSTGRES_PASSWORD: spiski
      # Deterministische Zeitzone: alle TIMESTAMPTZ-Werte werden in UTC gehalten.
      TZ: UTC
      PGTZ: UTC
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spiski -d spiski"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      # PostgreSQL 18 legt die Daten in ein versionsspezifisches Unterverzeichnis;
      # der Mount gehoert deshalb auf /var/lib/postgresql, nicht auf .../data.
      - postgres_data:/var/lib/postgresql
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  # Eigene Instanz fuer Tests. Daten liegen in tmpfs: schnell und garantiert
  # leer nach jedem Neustart, damit ein abgebrochener Testlauf nichts hinterlaesst.
  postgres_test:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: spiski
      POSTGRES_USER: spiski
      POSTGRES_PASSWORD: spiski
      TZ: UTC
      PGTZ: UTC
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spiski -d spiski"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 20s
    command: >
      postgres -c fsync=off -c full_page_writes=off -c synchronous_commit=off

volumes:
  postgres_data:
  composer_cache:
  caddy_data:
  caddy_config:
