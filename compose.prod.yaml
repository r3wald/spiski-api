# Server-Stack: FrankenPHP (Code im Image, mit Mercure-Hub), PostgreSQL.
#
# Dieselbe Datei fuer beide Server-Umgebungen, jeweils in einem eigenen Verzeichnis:
#
#   Stage     Verzeichnis   Compose-Projekt  Env-Datei     Port  URL
#   prod      ~/spiski      spiski-prod      .env.prod     8081  https://spiski.r3wald.net
#   staging   ~/spiski-dev  spiski-staging   .env.staging  8082  https://spiski-dev.r3wald.net
#
# Das Compose-Projekt trennt Container, Netz und Volumes (eigene Datenbank). SPISKI_STAGE
# waehlt Env-Datei und Image-Tag. Alles zusammen setzen die Make-Targets (make prod-up,
# make staging-up, ...); direkt aufgerufen gilt prod:
#
#   docker compose --env-file .env.prod -f compose.prod.yaml up -d --build
#   SPISKI_STAGE=staging HTTP_PORT=8082 docker compose -p spiski-staging \
#     --env-file .env.staging -f compose.prod.yaml up -d --build
#
# Nur lokal erreichbar: FrankenPHP lauscht ausschliesslich auf 127.0.0.1. TLS und die
# oeffentliche Erreichbarkeit uebernimmt der Nginx-Reverse-Proxy auf dem Host
# (Beispiel-Konfiguration in README.md, Abschnitt "Server").
#
# Immer mit --env-file aufrufen, sonst fehlt POSTGRES_PASSWORD. Secrets stehen
# ausschliesslich in .env.prod bzw. .env.staging (nicht im Repo, nicht im Image).

name: spiski-prod

x-php: &php
  build:
    context: .
    target: prod
  # Eigener Tag je Stage: Ein Staging-Build darf das Prod-Image nicht ueberschreiben.
  image: spiski-api:${SPISKI_STAGE:-prod}
  env_file: .env.${SPISKI_STAGE:-prod}

services:
  php:
    <<: *php
    restart: unless-stopped
    environment:
      # Signiert Publisher- und Abo-Token; Hub und Symfony lesen denselben Wert.
      MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET:?MERCURE_JWT_SECRET fehlt - in .env.prod bzw. .env.staging setzen (mind. 32 Zeichen)}
    ports:
      # Bewusst an Loopback gebunden. Nicht auf 0.0.0.0 aendern: FrankenPHP
      # spricht hier kein TLS, und der Bearer-Token waere im Klartext lesbar.
      # Port je Stage aus dem Makefile: prod 8081, staging 8082.
      - "127.0.0.1:${HTTP_PORT:-8081}:80"
    volumes:
      - ./docker/frankenphp/Caddyfile.prod:/etc/frankenphp/Caddyfile:ro
      # Statische Downloads (spiski.apk, spiski.json, Web-App unter app/)
      # kommen ohne Image-Neubau dazu. Muss derselbe Stand wie das Image sein
      # (gleicher Checkout).
      - ./public:/app/public:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-spiski}
      POSTGRES_USER: ${POSTGRES_USER:-spiski}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt - mit --env-file .env.prod bzw. .env.staging aufrufen}
      # Deterministische Zeitzone: alle TIMESTAMPTZ-Werte werden in UTC gehalten.
      TZ: UTC
      PGTZ: UTC
    # Kein ports:-Mapping – die Datenbank ist nur im Compose-Netz erreichbar.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      # PostgreSQL 18 legt die Daten in ein versionsspezifisches Unterverzeichnis;
      # der Mount gehoert deshalb auf /var/lib/postgresql, nicht auf .../data.
      - postgres_data:/var/lib/postgresql

  # Einmalig pro Deployment: make prod-migrate bzw. make staging-migrate
  migrate:
    <<: *php
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    command: ["php", "bin/console", "doctrine:migrations:migrate", "--no-interaction", "--all-or-nothing"]

volumes:
  postgres_data:
