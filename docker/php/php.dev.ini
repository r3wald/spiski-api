; Entwicklungs-Konfiguration – bewusst gesprächig und ohne Opcache-Caching.
display_errors = On
error_reporting = E_ALL
memory_limit = 512M

; Der Sync-Endpoint nimmt bis zu 1 MiB entgegen (CLAUDE.md 5.4). Etwas Luft für
; Header und Framework-Overhead.
post_max_size = 2M
upload_max_filesize = 2M

opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

date.timezone = UTC
