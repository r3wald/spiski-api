# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

parameters:
    # Version der API (des Vertrags mit der App). Einzige Quelle: steht in openapi.yaml
    # (info.version, siehe nelmio_api_doc.yaml) und auf /status.json bzw. /status.html.
    # Bei Aenderungen am Vertrag anheben, danach `make openapi`.
    spiski.api_version: '1.0.0'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Doctrine/'
            - '../src/Entity/'
            - '../src/Exception/'
            - '../src/Kernel.php'
            - '../src/Sync/Dto/'
            - '../src/Sync/MergeDecision.php'
            - '../src/Sync/SyncLimits.php'

    App\Sync\ClockSkewGuard:
        arguments:
            $toleranceSeconds: '%env(int:SPISKI_CLOCK_SKEW_TOLERANCE)%'

    # Leer oder kuerzer als 32 Zeichen = Admin-Zugang abgeschaltet.
    App\Security\AdminTokenAuthenticator:
        arguments:
            $adminToken: '%env(ADMIN_TOKEN)%'

    App\EventListener\ApiExceptionListener:
        arguments:
            $debug: '%kernel.debug%'
