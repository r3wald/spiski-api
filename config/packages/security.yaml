security:
    # Kein Passwort-Hashing: die Account-UUID *ist* das Secret (CLAUDE.md 6),
    # es gibt keine Credentials, die gehasht werden koennten.
    providers:
        spiski:
            id: App\Security\UserProvider

    firewalls:
        health:
            pattern: ^/v1/health$
            security: false

        # Oeffentliche Statusseite, ohne Auth.
        status:
            pattern: ^/status\.(json|html)$
            security: false

        docs:
            pattern: ^/(api/doc|_profiler|_wdt)
            security: false

        # Admin-Seite /admin und /v1/admin/*: eigenes Token statt Account-UUID, bei jedem
        # Request im Authorization-Header (CLAUDE.md 6). Muss vor
        # der Firewall "api" stehen, sonst wuerde dort das Token als UUID gelesen.
        admin:
            pattern: ^/(v1/)?admin(/|$)
            stateless: true
            custom_authenticators:
                - App\Security\AdminTokenAuthenticator
            entry_point: App\Security\AdminTokenAuthenticator

        api:
            pattern: ^/
            stateless: true
            provider: spiski
            custom_authenticators:
                - App\Security\UuidBearerAuthenticator
            entry_point: App\Security\UuidBearerAuthenticator

    access_control:
        - { path: ^/v1/health$, roles: PUBLIC_ACCESS }
        - { path: ^/status\.(json|html)$, roles: PUBLIC_ACCESS }
        - { path: ^/(v1/)?admin(/|$), roles: ROLE_ADMIN }
        - { path: ^/v1/, roles: ROLE_USER }
