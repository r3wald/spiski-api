doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        server_version: '18'
        profiling_collect_backtrace: '%kernel.debug%'

        types:
            # TIMESTAMPTZ mit Mikrosekunden. Der Doctrine-Standardtyp schreibt
            # TIMESTAMP(0) und schneidet Millisekunden ab – damit waere die
            # LWW-Aufloesung aus CLAUDE.md 5.3 kaputt.
            datetime_ms: App\Doctrine\DateTimeMsType

    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
