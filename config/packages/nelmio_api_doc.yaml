nelmio_api_doc:
    documentation:
        openapi: 3.0.0
        info:
            title: Spiski Sync API
            description: |
                Synchronisiert Einkaufslisten und Artikel der Spiski-App zwischen
                Geraeten desselben Nutzers. Es gibt keinen klassischen Account:
                die Authentifizierung erfolgt ueber eine client-generierte
                Account-UUID als Bearer-Token.

                Alle Zeitstempel sind ISO-8601 in UTC mit Millisekunden
                (`2026-08-21T14:03:11.482Z`). Konflikte werden per Last-Write-Wins
                ueber `(updatedAt, clientId)` aufgeloest.

                Ende-zu-Ende-Verschluesselung: Clients, die sie beherrschen, senden
                auf jedem Request `X-Spiski-Protocol: 2`. Verschluesselte Zeilen
                tragen `enc` (Chiffretext `v1.<nonce>.<chiffretext>`) statt der
                Klartext-Felder; der Server sieht nie einen Schluessel. Konten in
                `migrating`/`encrypted` – und nach Ablauf der Frist alle Konten –
                bekommen ohne den Header `426 upgrade-required` (ausser
                `DELETE /v1/me` und `GET /v1/health`).
            version: '%spiski.api_version%'
        servers:
            - url: /
              description: Aktuelle Instanz
        tags:
            - name: Sync
              description: Push und Pull in einem Request.
            - name: Account
              description: Verwaltung der Nutzerdaten.
            - name: Sharing
              description: Einzelne Listen mit anderen Konten teilen.
            - name: Live
              description: Live-Updates ueber den Mercure-Hub.
            - name: Encryption
              description: Umstellung eines Kontos auf Ende-zu-Ende-Verschluesselung.
            - name: System
        components:
            parameters:
                ProtocolHeader:
                    name: X-Spiski-Protocol
                    in: header
                    required: false
                    description: >
                        Protokollversion des Clients. `2` = kann verschluesselte Zeilen lesen
                        und schreiben; fehlt der Header, gilt `1`. Gehoert auf jeden Request.
                    schema: { type: integer, enum: [1, 2], default: 1 }
            securitySchemes:
                AccountUuid:
                    type: http
                    scheme: bearer
                    bearerFormat: UUID
                    description: Die client-generierte Account-UUID (UUIDv4).
            schemas:
                Problem:
                    type: object
                    description: Fehlerdarstellung nach RFC 9457.
                    properties:
                        type: { type: string, format: uri, example: 'https://spiski.app/problems/rate-limited' }
                        title: { type: string, example: 'Too Many Requests' }
                        status: { type: integer, example: 429 }
                        detail: { type: string, example: 'Sync-Limit erreicht.' }
                    required: [type, title, status, detail]

                ListChange:
                    type: object
                    description: >
                        Eine vom Client gepushte Listen-Zeile. Klartext mit `name`, oder
                        verschluesselt mit `enc` und `wrappedKey` (dann ohne `name`).
                        Welche Form gilt, bestimmt der Zustand des Kontos; die andere ist `invalid`.
                    properties:
                        id: { type: string, format: uuid }
                        name: { type: string, minLength: 1, maxLength: 100 }
                        enc:
                            type: string
                            maxLength: 6144
                            pattern: '^v1\.[A-Za-z0-9_-]{16}\.[A-Za-z0-9_-]+$'
                            description: Verschluesselter Name (AES-256-GCM, base64url ohne Padding).
                        wrappedKey:
                            type: string
                            maxLength: 256
                            pattern: '^v1\.[A-Za-z0-9_-]{16}\.[A-Za-z0-9_-]+$'
                            description: >
                                Listenschluessel, mit dem Kontoschluessel verpackt. Im Pull der
                                Schluessel des abfragenden Kontos (Besitzer oder Mitglied).
                        color:
                            type: integer
                            format: int64
                            minimum: 0
                            maximum: 4294967295
                            description: ARGB aus Flutters Color.toARGB32(), vorzeichenlos 32 Bit.
                        sortOrder: { type: integer, format: int32 }
                        createdAt: { type: string, format: date-time }
                        updatedAt:
                            type: string
                            format: date-time
                            description: >
                                Entscheidet den Last-Write-Wins-Vergleich. Werte mehr als
                                fuenf Minuten in der Zukunft werden serverseitig gekappt.
                        deletedAt:
                            type: [string, 'null']
                            format: date-time
                            description: Gesetzt = Tombstone. Es gibt keinen separaten Delete-Endpoint.
                    required: [id, color, sortOrder, createdAt, updatedAt]

                ItemChange:
                    type: object
                    description: >
                        Eine vom Client gepushte Artikel-Zeile. Klartext mit `name`, `quantity`,
                        `unit` und `note`, oder verschluesselt mit `enc` (dann ohne diese vier).
                    properties:
                        id: { type: string, format: uuid }
                        listId:
                            type: string
                            format: uuid
                            description: Muss zu einer Liste desselben Nutzers gehoeren, sonst `unknown_list`.
                        name: { type: string, minLength: 1, maxLength: 200 }
                        enc:
                            type: string
                            maxLength: 6144
                            pattern: '^v1\.[A-Za-z0-9_-]{16}\.[A-Za-z0-9_-]+$'
                            description: Verschluesselt Name, Menge, Einheit und Notiz.
                        quantity: { type: [number, 'null'], format: double, minimum: 0 }
                        unit: { type: [string, 'null'], maxLength: 20 }
                        isChecked: { type: boolean, default: false }
                        note: { type: [string, 'null'], maxLength: 500 }
                        sortOrder: { type: integer, format: int32 }
                        createdAt: { type: string, format: date-time }
                        updatedAt: { type: string, format: date-time }
                        deletedAt: { type: [string, 'null'], format: date-time }
                        movedAt: { type: [string, 'null'], format: date-time }
                    required: [id, listId, sortOrder, createdAt, updatedAt]

                ListState:
                    description: Der autoritative Serverstand einer Liste.
                    allOf:
                        - $ref: '#/components/schemas/ListChange'
                        - type: object
                          properties:
                              serverVersion:
                                  type: integer
                                  format: int64
                                  description: Version aus dem Zaehler des abfragenden Kontos.
                              role:
                                  type: string
                                  enum: [owner, member]
                                  description: >
                                      `member` = mit diesem Konto geteilt. Mitglieder duerfen Artikel
                                      aendern, die Liste selbst nur der Besitzer.
                              memberCount:
                                  type: integer
                                  minimum: 0
                                  description: Mit wie vielen Konten die Liste geteilt ist (ohne Besitzer).
                              joinedAt:
                                  type: string
                                  format: date-time
                                  nullable: true
                                  description: >
                                      Wann das abfragende Konto der Liste beigetreten ist (UTC, ms).
                                      `null` bei eigenen Listen.
                          required: [serverVersion, role, memberCount, joinedAt]

                ItemState:
                    description: Der autoritative Serverstand eines Artikels.
                    allOf:
                        - $ref: '#/components/schemas/ItemChange'
                        - type: object
                          properties:
                              serverVersion: { type: integer, format: int64 }
                              changedByOther:
                                  type: boolean
                                  description: >
                                      Zuletzt hat ein anderes Konto den Artikel geaendert (Mitglied oder
                                      Besitzer einer geteilten Liste); eigene Geraete zaehlen nicht.
                                      Wird nie gepusht.
                          required: [serverVersion, changedByOther]

                PushResult:
                    type: object
                    description: Rueckmeldung zu genau einer gepushten Zeile.
                    properties:
                        id: { type: string, format: uuid }
                        accepted: { type: boolean }
                        reason:
                            type: string
                            enum: [stale, unknown_list, invalid, quota_exceeded, forbidden]
                            description: Nur bei `accepted = false` gesetzt.
                    required: [id, accepted]

                SyncRequest:
                    type: object
                    properties:
                        since:
                            type: integer
                            format: int64
                            minimum: 0
                            description: >
                                Zuletzt gesehener `serverCursor`. Liegt der Wert ueber dem
                                Serverstand, antwortet der Server mit `fullResync = true`.
                        clientId:
                            type: string
                            format: uuid
                            description: >
                                Installations-UUID des Geraets, nicht die Account-UUID. Dient
                                als Tiebreaker bei identischem `updatedAt` und wird beim
                                Koppeln eines Zweitgeraets NICHT uebertragen.
                        limit:
                            type: integer
                            minimum: 1
                            maximum: 1000
                            default: 500
                            description: Maximale Zeilenzahl im Pull-Fenster.
                        changes:
                            type: object
                            description: Zusammen hoechstens 500 Zeilen, Body hoechstens 1 MiB.
                            properties:
                                lists:
                                    type: array
                                    items: { $ref: '#/components/schemas/ListChange' }
                                items:
                                    type: array
                                    items: { $ref: '#/components/schemas/ItemChange' }
                    required: [since, clientId]

                SyncResponse:
                    type: object
                    properties:
                        serverCursor:
                            type: integer
                            format: int64
                            description: Wert fuer `since` im naechsten Request.
                        hasMore:
                            type: boolean
                            description: Das Pull-Fenster wurde gekuerzt; sofort erneut syncen.
                        fullResync:
                            type: boolean
                            description: >
                                Der gesendete `since` lag ueber dem Serverstand. Der Client
                                verwirft nach vollstaendigem Durchlauf alle lokalen Zeilen,
                                die nicht geliefert wurden.
                        changes:
                            type: object
                            description: >
                                Autoritativer Serverstand. Enthaelt das Pull-Fenster und
                                zusaetzlich jede gepushte Zeile, auch abgelehnte. Listen sind
                                vor Artikeln anzuwenden.
                            properties:
                                lists:
                                    type: array
                                    items: { $ref: '#/components/schemas/ListState' }
                                items:
                                    type: array
                                    items: { $ref: '#/components/schemas/ItemState' }
                            required: [lists, items]
                        revokedLists:
                            type: array
                            items: { type: string, format: uuid }
                            description: >
                                Listen, auf die das Konto keinen Zugriff mehr hat (Teilen beendet,
                                verlassen, Besitzer geloescht). Der Client entfernt sie samt
                                Artikeln, auch wenn dort noch Aenderungen ausstehen.
                        pushResults:
                            type: object
                            properties:
                                lists:
                                    type: array
                                    items: { $ref: '#/components/schemas/PushResult' }
                                items:
                                    type: array
                                    items: { $ref: '#/components/schemas/PushResult' }
                            required: [lists, items]
                    required: [serverCursor, hasMore, fullResync, changes, revokedLists, pushResults]

                LiveSubscription:
                    type: object
                    properties:
                        hub:
                            type: string
                            example: '/.well-known/mercure'
                            description: Mercure-Hub, relativ zur API.
                        topic:
                            type: string
                            example: 'urn:spiski:account:3f2a…'
                            description: Topic des Kontos (HMAC, enthaelt nie die Konto-ID).
                        token:
                            type: string
                            description: Abo-Token (JWT), darf nur dieses Topic lesen.
                        expiresAt:
                            type: string
                            format: date-time
                    required: [hub, topic, token, expiresAt]

                ShareCode:
                    type: object
                    properties:
                        code:
                            type: string
                            example: 'K3M9QZ7T2B8XWPRC4N6DHJFA'
                            description: 24 Zeichen Crockford-Base32, 120 Bit.
                        url:
                            type: string
                            format: uri
                            example: 'https://spiski.r3wald.net/join/K3M9QZ7T2B8XWPRC4N6DHJFA'
                    required: [code, url]

                JoinRequest:
                    type: object
                    description: Nur fuer verschluesselte Listen noetig; sonst darf der Body fehlen.
                    properties:
                        wrappedKey:
                            type: string
                            maxLength: 256
                            pattern: '^v1\.[A-Za-z0-9_-]{16}\.[A-Za-z0-9_-]+$'
                            description: >
                                Listenschluessel aus dem Link-Fragment (`#k=…`), mit dem eigenen
                                Kontoschluessel verpackt.

                EncryptionStatus:
                    type: object
                    properties:
                        state:
                            type: string
                            enum: [plaintext, migrating, encrypted]
                        keyCheck:
                            type: string
                            nullable: true
                            description: >
                                Fester Text, mit dem Kontoschluessel verschluesselt. Ein Geraet
                                prueft damit seinen Konto-Code; der Server kann ihn nicht pruefen.
                    required: [state, keyCheck]

                EncryptionBegin:
                    type: object
                    properties:
                        clientId:
                            type: string
                            format: uuid
                            description: Das Geraet, das die Umstellung fuehrt. Nur es darf bis zum `commit` synchronisieren.
                        keyCheck:
                            type: string
                            maxLength: 256
                            pattern: '^v1\.[A-Za-z0-9_-]{16}\.[A-Za-z0-9_-]+$'
                    required: [clientId, keyCheck]

                EncryptionCommit:
                    type: object
                    properties:
                        clientId: { type: string, format: uuid }
                        keyCheck:
                            type: string
                            maxLength: 256
                            pattern: '^v1\.[A-Za-z0-9_-]{16}\.[A-Za-z0-9_-]+$'
                            description: Pflicht nur ohne vorheriges `begin` (Konto ohne Zeilen).
                    required: [clientId]

                JoinResult:
                    type: object
                    properties:
                        listId: { type: string, format: uuid }
                    required: [listId]

                Health:
                    type: object
                    properties:
                        status: { type: string, enum: [ok, degraded] }
                        database: { type: string, enum: [up, down] }
                    required: [status, database]
        security:
            - AccountUuid: []
    areas:
        path_patterns:
            # Die Admin-Endpunkte gehoeren nicht zum Vertrag mit der App.
            - ^/v1(?!/admin)
