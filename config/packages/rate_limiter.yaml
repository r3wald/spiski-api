framework:
    rate_limiter:
        # Pro Account-UUID. Deckt normales Polling plus Debounce-Bursts ab und
        # bremst gleichzeitig Enumerations-/Abuse-Versuche (CLAUDE.md 6).
        sync:
            policy: sliding_window
            limit: 60
            interval: '1 minute'

        # Pro IP, und zwar nur fuer das *Anlegen* bisher unbekannter Accounts.
        # Ohne diese Grenze laesst sich die Tabelle app_user trivial fluten,
        # weil jede valide UUID beim ersten Kontakt einen Datensatz erzeugt.
        account_creation:
            policy: fixed_window
            limit: 20
            interval: '1 hour'

        # Pro Account, fuer das Einloesen von Teilen-Codes. Die Codes haben
        # 120 Bit und sind nicht zu erraten; das Limit bremst trotzdem Versuche.
        share_join:
            policy: sliding_window
            limit: 30
            interval: '1 hour'

        # Pro IP, fuer jede Anfrage an /v1/admin (auch erfolgreiche). Bremst das
        # Raten des Admin-Tokens; das Token selbst ist ein langes Zufalls-Secret.
        admin:
            policy: sliding_window
            limit: 30
            interval: '1 minute'

when@test:
    framework:
        rate_limiter:
            # In Tests praktisch abgeschaltet; die Limiter haben eigene Tests,
            # die die Grenzen per Konfiguration gezielt herunterdrehen.
            sync:
                policy: sliding_window
                limit: 10000
                interval: '1 minute'
            account_creation:
                policy: fixed_window
                limit: 10000
                interval: '1 hour'
            admin:
                policy: sliding_window
                limit: 10000
                interval: '1 minute'
            share_join:
                policy: sliding_window
                limit: 10000
                interval: '1 hour'
