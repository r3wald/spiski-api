openapi: 3.0.0
info:
  title: 'Spiski Sync API'
  description: "Synchronisiert Einkaufslisten und Artikel der Spiski-App zwischen\nGeraeten desselben Nutzers. Es gibt keinen klassischen Account:\ndie Authentifizierung erfolgt ueber eine client-generierte\nAccount-UUID als Bearer-Token.\n\nAlle Zeitstempel sind ISO-8601 in UTC mit Millisekunden\n(`2026-08-21T14:03:11.482Z`). Konflikte werden per Last-Write-Wins\nueber `(updatedAt, clientId)` aufgeloest.\n\nEnde-zu-Ende-Verschluesselung: Clients, die sie beherrschen, senden\nauf jedem Request `X-Spiski-Protocol: 2`. Verschluesselte Zeilen\ntragen `enc` (Chiffretext `v1.<nonce>.<chiffretext>`) statt der\nKlartext-Felder; der Server sieht nie einen Schluessel. Konten in\n`migrating`/`encrypted` – und nach Ablauf der Frist alle Konten –\nbekommen ohne den Header `426 upgrade-required` (ausser\n`DELETE /v1/me` und `GET /v1/health`).\n"
  version: 1.1.0
servers:
  -
    url: /
    description: 'Aktuelle Instanz'
paths:
  /v1/me:
    delete:
      tags:
        - Account
      summary: 'Alle Daten des Nutzers loeschen'
      description: "Loescht Nutzer, Listen und Artikel unwiderruflich (Recht auf\nLoeschung). Mit anderen geteilte Listen verschwinden auch bei deren\nMitgliedern; aus fremden geteilten Listen tritt das Konto aus. Derselbe Bearer-Token legt beim naechsten Request einen\nleeren Account an; der Client muss seinen `lastSyncCursor`\ngleichzeitig lokal auf 0 zuruecksetzen."
      operationId: delete_v1_me_delete
      responses:
        '204':
          description: Geloescht
        '401':
          description: 'Bearer-Token fehlt oder ist keine UUID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/me/encryption:
    get:
      tags:
        - Encryption
      summary: 'Verschluesselungszustand des Kontos'
      description: 'Ein Geraet entscheidet damit zwischen „umstellen", „Umstellung fortsetzen" und „Konto-Code anfordern". Mit `keyCheck` prueft es vor dem ersten Sync, ob sein Kontoschluessel passt.'
      operationId: get_v1_me_encryption
      parameters:
        -
          $ref: '#/components/parameters/ProtocolHeader'
      responses:
        '200':
          description: Zustand
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EncryptionStatus'
        '426':
          description: 'Header X-Spiski-Protocol fehlt (alte App)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/me/encryption/begin:
    post:
      tags:
        - Encryption
      summary: 'Umstellung auf Verschluesselung beginnen'
      description: "Setzt das Konto auf `migrating`. Vorher werden **alle** Teilen-Beziehungen\ngeloest: Mitglieder eigener Listen verlieren den Zugriff (`revokedLists`),\nTeilen-Codes werden ungueltig, aus fremden Listen tritt das Konto aus.\nDanach darf nur noch dieses Geraet synchronisieren; alte Apps bekommen `426`.\nFuer dasselbe Geraet idempotent."
      operationId: post_v1_me_encryption_begin
      parameters:
        -
          $ref: '#/components/parameters/ProtocolHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EncryptionBegin'
      responses:
        '200':
          description: 'Umstellung laeuft'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EncryptionStatus'
        '400':
          description: 'clientId oder keyCheck fehlt oder ist ungueltig'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: '`migration-in-progress` (anderes Geraet) oder `already-encrypted`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '426':
          description: 'Header X-Spiski-Protocol fehlt (alte App)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/me/encryption/commit:
    post:
      tags:
        - Encryption
      summary: 'Umstellung auf Verschluesselung abschliessen'
      description: "Setzt das Konto auf `encrypted`, wenn keine Klartext-Zeile mehr auf dem\nServer liegt (sonst `409 encryption-incomplete`). Ein Konto ohne Zeilen\ndarf ohne `begin` direkt hierher und liefert dann `keyCheck` mit."
      operationId: post_v1_me_encryption_commit
      parameters:
        -
          $ref: '#/components/parameters/ProtocolHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EncryptionCommit'
      responses:
        '200':
          description: 'Konto ist verschluesselt'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EncryptionStatus'
        '400':
          description: 'clientId fehlt oder keyCheck fehlt bzw. ist ungueltig'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: '`encryption-incomplete` (Klartext-Zeilen vorhanden) oder `migration-in-progress`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '426':
          description: 'Header X-Spiski-Protocol fehlt (alte App)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/health:
    get:
      tags:
        - System
      summary: Health-Check
      operationId: get_v1_health
      responses:
        '200':
          description: 'Anwendung und Datenbank erreichbar'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: 'Datenbank nicht erreichbar'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
      security: []
  /v1/live:
    get:
      tags:
        - Live
      summary: 'Live-Updates abonnieren'
      description: "Liefert Hub, Topic und ein Abo-Token fuer den Mercure-Hub. Der Client\nabonniert damit `GET {hub}?match={topic}` (Server-Sent Events,\nMercure-Protokoll 1.0) und schickt das Token als\n`Authorization: Bearer`. Browser koennen bei EventSource keine Header\nsetzen: Fuer sie steht das Token zusaetzlich im HttpOnly-Cookie\n`__Secure-mercure_access_token`, das nur an den Hub geht.\n\nJede Nachricht bedeutet nur \"es gibt Neues\": Der Client synchronisiert\ndaraufhin wie gewohnt. `origin` ist die clientId des Geraets, das die\nAenderung ausgeloest hat (nur auf dem eigenen Konto, sonst `null`);\ndieses Geraet kann die Nachricht ignorieren."
      operationId: get_v1_live
      responses:
        '200':
          description: Abo-Daten
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveSubscription'
        '401':
          description: 'Bearer-Token fehlt oder ist keine UUID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  '/v1/lists/{id}/share':
    post:
      tags:
        - Sharing
      summary: 'Teilen-Code einer Liste abrufen'
      description: 'Liefert den Teilen-Code der Liste und legt ihn beim ersten Aufruf an. Nur der Besitzer. Der Code gilt, bis er erneuert oder das Teilen beendet wird.'
      operationId: post_v1_list_share
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 'Code und Link'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareCode'
        '403':
          description: 'Nur der Besitzer darf teilen'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 'Liste unbekannt oder nicht sichtbar'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      tags:
        - Sharing
      summary: 'Teilen beenden'
      description: 'Der Code wird ungueltig, alle Mitglieder verlieren den Zugriff und bekommen die Liste beim naechsten Sync als `revokedLists`. Nur der Besitzer.'
      operationId: delete_v1_list_share_stop
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 'Teilen beendet'
        '403':
          description: 'Nur der Besitzer darf teilen'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 'Liste unbekannt oder nicht sichtbar'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  '/v1/lists/{id}/share/renew':
    post:
      tags:
        - Sharing
      summary: 'Neuen Teilen-Code erzeugen'
      description: 'Der bisherige Code wird ungueltig. Bestehende Mitglieder behalten ihren Zugriff. Nur der Besitzer.'
      operationId: post_v1_list_share_renew
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 'Neuer Code und Link'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareCode'
        '403':
          description: 'Nur der Besitzer darf teilen'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 'Liste unbekannt oder nicht sichtbar'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  '/v1/lists/{id}/membership':
    delete:
      tags:
        - Sharing
      summary: 'Geteilte Liste verlassen'
      description: 'Das eigene Konto verliert den Zugriff; die Liste kommt beim naechsten Sync als `revokedLists`.'
      operationId: delete_v1_list_leave
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Verlassen
        '404':
          description: 'Kein Mitglied dieser Liste'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 'Der Besitzer kann nicht austreten'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  '/v1/shares/{code}':
    post:
      tags:
        - Sharing
      summary: 'Einer geteilten Liste beitreten'
      description: "Macht das eigene Konto zum Mitglied. Die Liste und ihre Artikel kommen mit dem naechsten Sync. Idempotent. Gross-/Kleinschreibung, Bindestriche und Leerzeichen im Code sind egal.\n\nVerschluesselte Listen: Besitzer und Mitglied muessen beide verschluesselt sein, und der Body traegt `wrappedKey` – den Listenschluessel aus dem Link-Fragment, mit dem eigenen Kontoschluessel verpackt. Ein erneuter Beitritt mit `wrappedKey` ersetzt den gespeicherten."
      operationId: post_v1_share_join
      parameters:
        -
          name: code
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinRequest'
      responses:
        '200':
          description: Beigetreten
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinResult'
        '400':
          description: '`wrappedKey` fehlt (verschluesselte Liste) oder ist ungueltig'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 'Code unbekannt oder nicht mehr gueltig'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 'Zu viele Mitglieder bzw. geteilte Listen, oder `encryption-required` (Besitzer und Mitglied nicht im selben Verschluesselungszustand)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: 'Zu viele Versuche, siehe Retry-After'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/sync:
    post:
      tags:
        - Sync
      summary: 'Lokale Aenderungen hochladen und fremde abholen'
      description: "Push und Pull in einem Request, serverseitig in einer Transaktion.\n\nAblauf: eingehende Zeilen werden per Last-Write-Wins ueber\n`(updatedAt, clientId)` gegen den Serverstand gehalten, akzeptierte\nZeilen bekommen eine neue `serverVersion`. Danach liefert die Antwort\nalle Zeilen mit `serverVersion > since` – plus den Serverstand jeder\ngepushten Zeile, auch der abgelehnten."
      operationId: post_v1_sync
      parameters:
        -
          $ref: '#/components/parameters/ProtocolHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncRequest'
      responses:
        '200':
          description: 'Merge-Ergebnis und Pull-Fenster'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResponse'
        '400':
          description: 'JSON kaputt oder Pflichtfeld fehlt'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: 'Bearer-Token fehlt oder ist keine UUID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: '`migration-in-progress` (ein anderes Geraet stellt das Konto um) oder `encryption-required` (Frist abgelaufen, Konto noch unverschluesselt)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: 'Body groesser als 1 MiB oder mehr als 500 Push-Zeilen'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: '"since" oder "limit" ausserhalb des zulaessigen Bereichs'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '426':
          description: 'Alte App (ohne X-Spiski-Protocol: 2) und Konto verschluesselt bzw. Frist abgelaufen'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: 'Rate Limit erreicht, siehe Retry-After'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  schemas:
    Problem:
      description: 'Fehlerdarstellung nach RFC 9457.'
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          format: uri
          example: 'https://spiski.app/problems/rate-limited'
        title:
          type: string
          example: 'Too Many Requests'
        status:
          type: integer
          example: 429
        detail:
          type: string
          example: 'Sync-Limit erreicht.'
      type: object
    ListChange:
      description: "Eine vom Client gepushte Listen-Zeile. Klartext mit `name`, oder verschluesselt mit `enc` und `wrappedKey` (dann ohne `name`). Welche Form gilt, bestimmt der Zustand des Kontos; die andere ist `invalid`.\n"
      required:
        - id
        - color
        - sortOrder
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 100
          minLength: 1
        enc:
          description: 'Verschluesselter Name (AES-256-GCM, base64url ohne Padding).'
          type: string
          pattern: '^v1\.[A-Za-z0-9_-]{16}\.[A-Za-z0-9_-]+$'
          maxLength: 6144
        wrappedKey:
          description: "Listenschluessel, mit dem Kontoschluessel verpackt. Im Pull der Schluessel des abfragenden Kontos (Besitzer oder Mitglied).\n"
          type: string
          pattern: '^v1\.[A-Za-z0-9_-]{16}\.[A-Za-z0-9_-]+$'
          maxLength: 256
        color:
          description: 'ARGB aus Flutters Color.toARGB32(), vorzeichenlos 32 Bit.'
          type: integer
          format: int64
          maximum: 4294967295
          minimum: 0
        sortOrder:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        updatedAt:
          description: "Entscheidet den Last-Write-Wins-Vergleich. Werte mehr als fuenf Minuten in der Zukunft werden serverseitig gekappt.\n"
          type: string
          format: date-time
        deletedAt:
          description: 'Gesetzt = Tombstone. Es gibt keinen separaten Delete-Endpoint.'
          type: string
          format: date-time
          nullable: true
      type: object
    ItemChange:
      description: "Eine vom Client gepushte Artikel-Zeile. Klartext mit `name`, `quantity`, `unit` und `note`, oder verschluesselt mit `enc` (dann ohne diese vier).\n"
      required:
        - id
        - listId
        - sortOrder
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        listId:
          description: 'Muss zu einer Liste desselben Nutzers gehoeren, sonst `unknown_list`.'
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
          minLength: 1
        enc:
          description: 'Verschluesselt Name, Menge, Einheit und Notiz.'
          type: string
          pattern: '^v1\.[A-Za-z0-9_-]{16}\.[A-Za-z0-9_-]+$'
          maxLength: 6144
        quantity:
          type: number
          format: double
          minimum: 0
          nullable: true
        unit:
          type: string
          maxLength: 20
          nullable: true
        isChecked:
          type: boolean
          default: false
        note:
          type: string
          maxLength: 500
          nullable: true
        sortOrder:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
        movedAt:
          type: string
          format: date-time
          nullable: true
      type: object
    ListState:
      description: 'Der autoritative Serverstand einer Liste.'
      allOf:
        -
          $ref: '#/components/schemas/ListChange'
        -
          required:
            - serverVersion
            - role
            - memberCount
            - joinedAt
          properties:
            serverVersion:
              description: 'Version aus dem Zaehler des abfragenden Kontos.'
              type: integer
              format: int64
            role:
              description: "`member` = mit diesem Konto geteilt. Mitglieder duerfen Artikel aendern, die Liste selbst nur der Besitzer.\n"
              type: string
              enum:
                - owner
                - member
            memberCount:
              description: 'Mit wie vielen Konten die Liste geteilt ist (ohne Besitzer).'
              type: integer
              minimum: 0
            joinedAt:
              description: "Wann das abfragende Konto der Liste beigetreten ist (UTC, ms). `null` bei eigenen Listen.\n"
              type: string
              format: date-time
              nullable: true
          type: object
    ItemState:
      description: 'Der autoritative Serverstand eines Artikels.'
      allOf:
        -
          $ref: '#/components/schemas/ItemChange'
        -
          required:
            - serverVersion
            - changedByOther
          properties:
            serverVersion:
              type: integer
              format: int64
            changedByOther:
              description: "Zuletzt hat ein anderes Konto den Artikel geaendert (Mitglied oder Besitzer einer geteilten Liste); eigene Geraete zaehlen nicht. Wird nie gepusht.\n"
              type: boolean
          type: object
    PushResult:
      description: 'Rueckmeldung zu genau einer gepushten Zeile.'
      required:
        - id
        - accepted
      properties:
        id:
          type: string
          format: uuid
        accepted:
          type: boolean
        reason:
          description: 'Nur bei `accepted = false` gesetzt.'
          type: string
          enum:
            - stale
            - unknown_list
            - invalid
            - quota_exceeded
            - forbidden
      type: object
    SyncRequest:
      required:
        - since
        - clientId
      properties:
        since:
          description: "Zuletzt gesehener `serverCursor`. Liegt der Wert ueber dem Serverstand, antwortet der Server mit `fullResync = true`.\n"
          type: integer
          format: int64
          minimum: 0
        clientId:
          description: "Installations-UUID des Geraets, nicht die Account-UUID. Dient als Tiebreaker bei identischem `updatedAt` und wird beim Koppeln eines Zweitgeraets NICHT uebertragen.\n"
          type: string
          format: uuid
        limit:
          description: 'Maximale Zeilenzahl im Pull-Fenster.'
          type: integer
          default: 500
          maximum: 1000
          minimum: 1
        changes:
          description: 'Zusammen hoechstens 500 Zeilen, Body hoechstens 1 MiB.'
          properties:
            lists:
              type: array
              items:
                $ref: '#/components/schemas/ListChange'
            items:
              type: array
              items:
                $ref: '#/components/schemas/ItemChange'
          type: object
      type: object
    SyncResponse:
      required:
        - serverCursor
        - hasMore
        - fullResync
        - changes
        - revokedLists
        - pushResults
      properties:
        serverCursor:
          description: 'Wert fuer `since` im naechsten Request.'
          type: integer
          format: int64
        hasMore:
          description: 'Das Pull-Fenster wurde gekuerzt; sofort erneut syncen.'
          type: boolean
        fullResync:
          description: "Der gesendete `since` lag ueber dem Serverstand. Der Client verwirft nach vollstaendigem Durchlauf alle lokalen Zeilen, die nicht geliefert wurden.\n"
          type: boolean
        changes:
          description: "Autoritativer Serverstand. Enthaelt das Pull-Fenster und zusaetzlich jede gepushte Zeile, auch abgelehnte. Listen sind vor Artikeln anzuwenden.\n"
          required:
            - lists
            - items
          properties:
            lists:
              type: array
              items:
                $ref: '#/components/schemas/ListState'
            items:
              type: array
              items:
                $ref: '#/components/schemas/ItemState'
          type: object
        revokedLists:
          description: "Listen, auf die das Konto keinen Zugriff mehr hat (Teilen beendet, verlassen, Besitzer geloescht). Der Client entfernt sie samt Artikeln, auch wenn dort noch Aenderungen ausstehen.\n"
          type: array
          items:
            type: string
            format: uuid
        pushResults:
          required:
            - lists
            - items
          properties:
            lists:
              type: array
              items:
                $ref: '#/components/schemas/PushResult'
            items:
              type: array
              items:
                $ref: '#/components/schemas/PushResult'
          type: object
      type: object
    LiveSubscription:
      required:
        - hub
        - topic
        - token
        - expiresAt
      properties:
        hub:
          description: 'Mercure-Hub, relativ zur API.'
          type: string
          example: /.well-known/mercure
        topic:
          description: 'Topic des Kontos (HMAC, enthaelt nie die Konto-ID).'
          type: string
          example: 'urn:spiski:account:3f2a…'
        token:
          description: 'Abo-Token (JWT), darf nur dieses Topic lesen.'
          type: string
        expiresAt:
          type: string
          format: date-time
      type: object
    ShareCode:
      required:
        - code
        - url
      properties:
        code:
          description: '24 Zeichen Crockford-Base32, 120 Bit.'
          type: string
          example: K3M9QZ7T2B8XWPRC4N6DHJFA
        url:
          type: string
          format: uri
          example: 'https://spiski.r3wald.net/join/K3M9QZ7T2B8XWPRC4N6DHJFA'
      type: object
    JoinRequest:
      description: 'Nur fuer verschluesselte Listen noetig; sonst darf der Body fehlen.'
      properties:
        wrappedKey:
          description: "Listenschluessel aus dem Link-Fragment (`#k=…`), mit dem eigenen Kontoschluessel verpackt.\n"
          type: string
          pattern: '^v1\.[A-Za-z0-9_-]{16}\.[A-Za-z0-9_-]+$'
          maxLength: 256
      type: object
    EncryptionStatus:
      required:
        - state
        - keyCheck
      properties:
        state:
          type: string
          enum:
            - plaintext
            - migrating
            - encrypted
        keyCheck:
          description: "Fester Text, mit dem Kontoschluessel verschluesselt. Ein Geraet prueft damit seinen Konto-Code; der Server kann ihn nicht pruefen.\n"
          type: string
          nullable: true
      type: object
    EncryptionBegin:
      required:
        - clientId
        - keyCheck
      properties:
        clientId:
          description: 'Das Geraet, das die Umstellung fuehrt. Nur es darf bis zum `commit` synchronisieren.'
          type: string
          format: uuid
        keyCheck:
          type: string
          pattern: '^v1\.[A-Za-z0-9_-]{16}\.[A-Za-z0-9_-]+$'
          maxLength: 256
      type: object
    EncryptionCommit:
      required:
        - clientId
      properties:
        clientId:
          type: string
          format: uuid
        keyCheck:
          description: 'Pflicht nur ohne vorheriges `begin` (Konto ohne Zeilen).'
          type: string
          pattern: '^v1\.[A-Za-z0-9_-]{16}\.[A-Za-z0-9_-]+$'
          maxLength: 256
      type: object
    JoinResult:
      required:
        - listId
      properties:
        listId:
          type: string
          format: uuid
      type: object
    Health:
      required:
        - status
        - database
        - version
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
        database:
          type: string
          enum:
            - up
            - down
        version:
          description: 'Version der API (wie in `info.version` dieser Beschreibung).'
          type: string
          example: 1.1.0
      type: object
  parameters:
    ProtocolHeader:
      name: X-Spiski-Protocol
      in: header
      description: "Protokollversion des Clients. `2` = kann verschluesselte Zeilen lesen und schreiben; fehlt der Header, gilt `1`. Gehoert auf jeden Request.\n"
      required: false
      schema:
        type: integer
        default: 1
        enum:
          - 1
          - 2
  securitySchemes:
    AccountUuid:
      type: http
      description: 'Die client-generierte Account-UUID (UUIDv4).'
      bearerFormat: UUID
      scheme: bearer
security:
  -
    AccountUuid: []
tags:
  -
    name: Sync
    description: 'Push und Pull in einem Request.'
  -
    name: Account
    description: 'Verwaltung der Nutzerdaten.'
  -
    name: Sharing
    description: 'Einzelne Listen mit anderen Konten teilen.'
  -
    name: Live
    description: 'Live-Updates ueber den Mercure-Hub.'
  -
    name: Encryption
    description: 'Umstellung eines Kontos auf Ende-zu-Ende-Verschluesselung.'
  -
    name: System

